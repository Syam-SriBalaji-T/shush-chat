spring:
  docker:
    compose:
      enabled: false

  # The developer's .env is imported by application.yml and would otherwise leak real
  # credentials into the test run -- switching SASL on against a Testcontainers broker that has
  # no authentication at all. Every container here is unauthenticated by construction, so these
  # are blanked explicitly rather than left to whatever happens to be on the machine.
  data:
    redis:
      password: ""
  elasticsearch:
    username: ""
    password: ""

shush:
  jwt:
    secret: test-secret-that-is-long-enough-for-hs256
  dev-endpoints:
    enabled: true
  kafka-auth:
    username: ""
    password: ""
  # Shortened so expiry is a thing tests can actually observe rather than assume. The behaviour
  # under test is that these keys expire on their own, not the exact duration.
  presence:
    ttl: 2s
    heartbeat: 1s
  typing:
    ttl: 1s
    throttle: 1s
  # Scheduled sweeps are driven explicitly in tests. Leaving them on a timer would make results
  # depend on whether a tick happened to fire mid-assertion.
  scheduler:
    purge-conversations: 1h
    expire-friend-requests: 1h
    purge-media: 1h
    purge-anonymous-users: 24h
    reconcile-unread: 24h
  matching:
    tick: 200ms
  name:
    # Widened from the production 1s: the behaviour under test is that a second shuffle inside
    # the window is refused, not the exact duration, and a one-second window is a race against
    # how long two HTTP calls happen to take.
    shuffle-interval: 30s
  storage:
    # Endpoint and credentials come from the MinIO container via MinioProperties.
    bucket: shush-media-test
