spring:
  docker:
    compose:
      enabled: false

shush:
  jwt:
    secret: test-secret-that-is-long-enough-for-hs256
  dev-endpoints:
    enabled: true
  # Shortened so expiry is a thing tests can actually observe rather than assume. The
  # behaviour under test is that these keys expire on their own, not the exact duration.
  presence:
    ttl: 2s
    heartbeat: 1s
  typing:
    ttl: 1s
    throttle: 1s
  # Scheduled sweeps are driven explicitly in tests. Leaving them on a timer would make results
  # depend on whether a tick happened to fire mid-assertion.
  scheduler:
    purge-conversations: 1h
    expire-friend-requests: 1h
    purge-media: 1h
    purge-anonymous-users: 24h
    reconcile-unread: 24h
  matching:
    tick: 200ms
