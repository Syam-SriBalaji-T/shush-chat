# Infrastructure only. The application under development runs on the host
# (`cd api && ./mvnw spring-boot:run`) so the debugger attaches and restarts are instant.
# Containerised replicas arrive in Phase 3 as compose.replicas.yaml.
#
# Every port is bound to 127.0.0.1 on purpose: Docker's default form binds 0.0.0.0 and
# writes straight into iptables' DOCKER chain, bypassing UFW (deploy.md 8).

name: shush

services:
  postgres:
    image: postgres:16.10-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shush}
      POSTGRES_USER: ${POSTGRES_USER:-shush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shush}
    ports:
      # Host port is 55432, not 5432: a native Postgres on the dev machine already
      # holds 5432 and Docker cannot then bind loopback. Container-side stays 5432.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shush} -d ${POSTGRES_DB:-shush}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.7-alpine
    profiles: ["core", "full"]
    # No persistence: everything Redis holds here (presence, typing, the backplane) is
    # derived state that must not outlive a restart. Losing it is correct behaviour.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:-shush-local-redis}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      # --no-auth-warning keeps the password out of the container's stderr.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-shush-local-redis} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.17
    profiles: ["core", "full"]
    command:
      - redpanda
      - start
      # Tuned down deliberately: the deployment target is a 2 GB ARM box and a reviewer's
      # `docker compose up` should not need a gigabyte for the broker (aim.md 4.2).
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://127.0.0.1:19092
      - --mode=dev-container
      # SASL/SCRAM on the Kafka API, and RP_BOOTSTRAP_USER below seeds the superuser.
      #
      # The listeners are declared as a whole array rather than with --kafka-addr, because
      # --kafka-addr rebuilds that array and silently discards any authentication_method set
      # alongside it. enable_sasl on its own then leaves the listeners unauthenticated while
      # every status check still reports healthy -- the Admin API does not go through SASL.
      - --set
      - >-
        redpanda.kafka_api=[{"address":"0.0.0.0","port":9092,"name":"INTERNAL","authentication_method":"sasl"},{"address":"0.0.0.0","port":19092,"name":"EXTERNAL","authentication_method":"sasl"}]
      - --set
      - redpanda.enable_sasl=true
      - --set
      - redpanda.superusers=["${KAFKA_USER:-shush}"]
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
      - "127.0.0.1:${REDPANDA_ADMIN_PORT:-19644}:9644"
    environment:
      RP_BOOTSTRAP_USER: "${KAFKA_USER:-shush}:${KAFKA_PASSWORD:-shush-local-kafka}:SCRAM-SHA-256"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X user=${KAFKA_USER:-shush} -X pass=${KAFKA_PASSWORD:-shush-local-kafka} -X sasl.mechanism=SCRAM-SHA-256 | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7
    # Not in the "core" profile deliberately. It is the heaviest thing in the stack serving the
    # least critical requirement (aim.md 4.3), and the correctness harness does not need it --
    # so an ordering or chaos run should not have to pay a gigabyte for it.
    profiles: ["search", "full"]
    environment:
      discovery.type: single-node
      # Authentication on, TLS off. TLS between a container and the app on the same Docker
      # network buys little and costs certificate management; authentication stops anything
      # else that reaches the port. A real deployment turns both on.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-shush-local-elastic}
      # Held down hard: this is a single-node index over a few hundred tag documents, not a
      # cluster. The default heap would be several times the rest of the stack combined.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:${ELASTICSEARCH_PASSWORD:-shush-local-elastic} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    # MinIO exists so a reviewer with no AWS account, no IAM keys and no bucket still gets
    # working S3-compatible storage from one command (aim.md 5.1).
    profiles: ["media", "full"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shushadmin}
      # MinIO refuses to start on a root password shorter than 8 characters.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shush-local-minio}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  minio-data:
  postgres-data:
  redpanda-data:
  elasticsearch-data:
