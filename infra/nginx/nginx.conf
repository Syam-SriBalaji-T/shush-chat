# Local three-replica ingress. Mirrors the changes deploy.md 7 requires of the real
# syamdev-infra config, so what is tested here is what is deployed there.

worker_processes auto;

events {
    # The default 1024 caps concurrency near 512 websockets, because each proxied socket costs
    # two file descriptors -- one downstream, one upstream. That is about 5% of the 10k target
    # and it fails *silently*, looking like an unexplained plateau in the load test.
    worker_connections 20480;
}

http {
    access_log off;

    # Sending `Connection: upgrade` on a plain HTTP request is wrong; this maps it so only an
    # actual upgrade request gets the header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream shush_api {
        # Not round-robin: websockets are long-lived and disconnect unevenly, so balancing at
        # assignment time drifts badly over a long run.
        least_conn;

        # No ip_hash and no sticky sessions anywhere in this file, deliberately. Any node can
        # serve any user because routing goes through the Redis backplane rather than through
        # connection affinity. If something here only works with ip_hash, the backplane is
        # broken and that is what needs fixing.
        server api-1:8080 max_fails=3 fail_timeout=5s;
        server api-2:8080 max_fails=3 fail_timeout=5s;
        server api-3:8080 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8081;

        location / {
            proxy_pass http://shush_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A quiet conversation is normal, and the default 60s would kill its socket. The
            # application also pings every 30s -- do both, because the heartbeat is correct
            # behaviour regardless and this is the safety net.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Let a replica being killed mid-run fail over rather than surface as a 502.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
