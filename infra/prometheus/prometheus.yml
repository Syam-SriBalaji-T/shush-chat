global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: shush-api
    metrics_path: /actuator/prometheus
    static_configs:
      # Scraped individually rather than through nginx: an aggregate hides the thing worth
      # seeing, which is whether load and connections are actually spread across replicas.
      - targets: ["api-1:8080", "api-2:8080", "api-3:8080"]
