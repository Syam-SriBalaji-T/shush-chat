# Overlay: Prometheus scraping the replicas' Actuator endpoint, and Grafana over it.
#
#   docker compose -f compose.yaml -f compose.replicas.yaml -f compose.observability.yaml \
#     --profile core up -d
#
# Separate from the replicas overlay so a correctness run does not have to pay for it: the
# benchmark measures the system, and a scraper competing for CPU on the same box is noise.

services:
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["core", "full", "obs"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["core", "full", "obs"]
    depends_on:
      - prometheus
    environment:
      # Anonymous admin was convenient and wrong: anything that reached the port had full
      # rights. A login costs one prompt.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-shush-local-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
